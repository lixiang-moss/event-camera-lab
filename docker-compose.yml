services:
  event-camera-ros:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: event-camera-lab:noetic
    container_name: event-camera-lab-ros
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
    environment:
      ROS_MASTER_URI: ${ROS_MASTER_URI:-http://localhost:11311}
      ROS_HOSTNAME: ${ROS_HOSTNAME:-localhost}
      DISPLAY: ${DISPLAY:-}
      QT_X11_NO_MITSHM: "1"
      ROS_WS: /workspace/ros_ws
      ROS_DEVEL_SPACE: /workspace/ros_ws/devel
    volumes:
      - .:/workspace
      - /dev/bus/usb:/dev/bus/usb
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./config/camera_info:/root/.ros/camera_info
    working_dir: /workspace

  event-camera-openeb31-ros:
    build:
      context: .
      dockerfile: docker/Dockerfile.openeb31
    image: event-camera-lab:openeb31-noetic
    container_name: event-camera-lab-openeb31-ros
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
    environment:
      ROS_MASTER_URI: ${ROS_MASTER_URI:-http://localhost:11311}
      ROS_HOSTNAME: ${ROS_HOSTNAME:-localhost}
      DISPLAY: ${DISPLAY:-}
      QT_X11_NO_MITSHM: "1"
      ROS_WS: /workspace/ros_ws
      ROS_DEVEL_SPACE: /workspace/ros_ws/devel_openeb31
    volumes:
      - .:/workspace
      - /dev/bus/usb:/dev/bus/usb
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./config/camera_info:/root/.ros/camera_info
    working_dir: /workspace
